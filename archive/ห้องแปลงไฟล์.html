<style>
/* Minimalist: white ground, ink as the only accent, hairlines instead of boxes.

:root{
  --bg:#FFFFFF;
  --surface:#FFFFFF;
  --surface2:#F5F6F7;
  --ink:#111418;
  --ink2:#454B55;

    --bg:#0F1114;--surface:#0F1114;--surface2:#181B20;--ink:#EDEEF0;--ink2:#B7BBC3;--muted:#7C828D;--line:#252A32;
    --accent:#EDEEF0;--accent-fg:#0F1114;--accent-soft:#1B1F26;--ok:#4FD1A1;--warn:#F2B25C;--err:#FF8A80;--err-soft:#2A1918;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1114;--surface:#0F1114;--surface2:#181B20;--ink:#EDEEF0;--ink2:#B7BBC3;--muted:#7C828D;--line:#252A32;
  --accent:#EDEEF0;--accent-fg:#0F1114;--accent-soft:#1B1F26;--ok:#4FD1A1;--warn:#F2B25C;--err:#FF8A80;--err-soft:#2A1918;
  color-scheme:dark;
}

.ri .m{flex:1;min-width:0}
.ri .m b{display:block;font-weight:500;font-size:.92rem;overflow-wrap:anywhere}
.ri .m small{display:block;color:var(--muted);font-size:.78rem;font-family:var(--f-mono)}
.ri .m small.g{color:var(--ok)}
.ri .m small.w{color:var(--warn)}
.err{background:var(--err-soft);color:var(--err);border-radius:6px;padding:10px 14px;font-size:.88rem}
.ftr{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(20px,env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:6px;font-size:.86rem;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100vw - 32px);z-index:20}

@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr);gap:28px}

  .grp{display:none}
  .nb{width:auto;flex:none;white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:5px 14px}
  .nb[aria-current="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
  .head h1{font-size:1.5rem}
}
@media (prefers-reduced-motion:reduce){.bar i,#toast,.drop{transition:none}}

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var fmtB=function(n){return n<1024?n+' B':n<1048576?(n/1024).toFixed(n<10240?1:0)+' KB':(n/1048576).toFixed(2)+' MB'};
var baseName=function(n){return n.replace(/\.[^.\/\\]+$/,'')};
var sleep=function(ms){return new Promise(function(r){setTimeout(r,ms)})};
var toastT;

function need(n){if(!window[n])throw new Error('โหลดส่วนประกอบของเครื่องมือไม่สำเร็จ ลองรีเฟรชหน้านี้');return window[n]}
function toBlob(c,t,q){return new Promise(function(res,rej){c.toBlob(function(b){b?res(b):rej(new Error('สร้างไฟล์ภาพไม่สำเร็จ'))},t,q)})}
function mkCanvas(w,h){var c=document.createElement('canvas');c.width=Math.max(1,Math.round(w));c.height=Math.max(1,Math.round(h));return c}
function freeCanvas(c){c.width=0;c.height=0}

/* ---------- runtime capabilities ---------- */
function useCap(n){try{return window.claude&&window.claude.use?window.claude.use(n).catch(function(){return null}):Promise.resolve(null)}catch(e){return Promise.resolve(null)}}
var DL=null,SAMPLE=null;
var dlP=useCap('downloads').then(function(x){DL=x;return x});
var smP=useCap('sample').then(function(x){SAMPLE=x;return x});

async function saveFile(name,blob){
  await dlP;
  if(DL){
    try{await DL.save({filename:name,data:blob});toast('บันทึกแล้ว')}
    catch(e){
      if(e&&e.code==='declined')return;
      if(e&&e.code==='rejected_extension'){toast('บันทึกไฟล์ประเภทนี้ไม่ได้');return}
      toast('บันทึกไม่สำเร็จ ลองอีกครั้ง');
    }
    return;
  }
  try{var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();toast('กำลังบันทึกไฟล์')}
  catch(e){toast('เบราว์เซอร์นี้บันทึกไฟล์จากหน้านี้ไม่ได้')}
}

/* ---------- images ---------- */
async function loadImage(file){
  try{return await createImageBitmap(file)}
  catch(_){
    var url=URL.createObjectURL(file);
    try{var img=new Image();img.src=url;await img.decode();return img}
    catch(e){throw new Error('เปิดไฟล์ภาพ "'+file.name+'" ไม่ได้ (รูปแบบที่เบราว์เซอร์ไม่รองรับ)')}
    finally{setTimeout(function(){URL.revokeObjectURL(url)},2000)}
  }
}
function dims(s){return [s.naturalWidth||s.width,s.naturalHeight||s.height]}
function drawImg(src,scale,white){
  var d=dims(src),c=mkCanvas(d[0]*scale,d[1]*scale),x=c.getContext('2d');
  if(white){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}
  x.imageSmoothingQuality='high';x.drawImage(src,0,0,c.width,c.height);return c;
}
var EXT={'image/jpeg':'jpg','image/png':'png','image/webp':'webp'};
async function encode(c,type,q){
  var b=await toBlob(c,type,q);
  if(b.type!==type)throw new Error('เบราว์เซอร์นี้บันทึกเป็น '+EXT[type].toUpperCase()+' ไม่ได้ ลองเลือกรูปแบบอื่น');
  return b;
}
function pickType(file,fmt){
  if(fmt==='jpeg')return 'image/jpeg';if(fmt==='png')return 'image/png';if(fmt==='webp')return 'image/webp';
  return EXT[file.type]?file.type:'image/jpeg';
}
async function compressOne(src,o){
  var d=dims(src),s=(o.maxSide&&Math.max(d[0],d[1])>o.maxSide)?o.maxSide/Math.max(d[0],d[1]):1;
  var white=o.type==='image/jpeg';
  var c=drawImg(src,s,white);
  if(!o.targetKB){var b0=await encode(c,o.type,o.q);freeCanvas(c);return {blob:b0,hit:true}}
  var target=o.targetKB*1024,best=null;
  for(var a=0;a<7;a++){
    if(o.type==='image/png'){
      var bp=await encode(c,o.type);best=bp;
      if(bp.size<=target){freeCanvas(c);return {blob:bp,hit:true}}
    }else{
      var bh=await encode(c,o.type,0.95);
      if(bh.size<=target){freeCanvas(c);return {blob:bh,hit:true}}
      var lo=0.05,hi=0.95,ok=null;
      for(var i=0;i<7;i++){var mid=(lo+hi)/2,bm=await encode(c,o.type,mid);if(bm.size<=target){ok=bm;lo=mid}else hi=mid}
      if(ok){freeCanvas(c);return {blob:ok,hit:true}}
      best=await encode(c,o.type,0.05);
    }
    s*=0.82;freeCanvas(c);c=drawImg(src,s,white);
  }
  freeCanvas(c);return {blob:best,hit:best.size<=target};
}

/* ---------- PDF helpers ---------- */
var pdfReady=false;
function pdfjs(){
  var p=need('pdfjsLib');
  if(!pdfReady){p.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';pdfReady=true}
  return p;
}
async function openPdf(file,password){
  var lib=pdfjs(),data=new Uint8Array(await file.arrayBuffer());
  try{return await lib.getDocument({data:data,password:password||undefined}).promise}
  catch(e){
    if(e&&e.name==='PasswordException')throw new Error(e.code===2?'รหัสผ่านไม่ถูกต้อง':'ไฟล์ "'+file.name+'" ต้องใช้รหัสผ่านเพื่อเปิด ใส่รหัสผ่านในช่องด้านบน');
    throw new Error('เปิดไฟล์ PDF "'+file.name+'" ไม่ได้ ไฟล์อาจเสียหาย');
  }
}
async function renderPage(page,scale){
  var base=page.getViewport({scale:1});
  scale=Math.min(scale,8000/Math.max(base.width,base.height));
  var vp=page.getViewport({scale:scale}),c=mkCanvas(vp.width,vp.height),x=c.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
  await page.render({canvasContext:x,viewport:vp}).promise;
  return c;
}
function parseRange(s,n){
  s=(s||'').trim();
  if(!s)return Array.from({length:n},function(_,i){return i+1});
  var set=new Set();
  s.split(/[,\s]+/).forEach(function(p){
    if(!p)return;var m=p.match(/^(\d+)(?:-(\d+))?$/);
    if(!m)throw new Error('ช่วงหน้าไม่ถูกต้อง: '+p);
    var a=+m[1],b=m[2]?+m[2]:a;if(a>b){var t=a;a=b;b=t}
    for(var i=Math.max(1,a);i<=Math.min(n,b);i++)set.add(i);
  });
  if(!set.size)throw new Error('ไม่มีหน้าตามช่วงที่ระบุ (ไฟล์มี '+n+' หน้า)');
  return Array.from(set).sort(function(a,b){return a-b});
}
async function pageText(page){
  var vp=page.getViewport({scale:1}),tc=await page.getTextContent(),its=[];
  tc.items.forEach(function(it){
    if(typeof it.str!=='string'||!it.str.trim())return;
    var t=it.transform;
    its.push({s:it.str,x:t[4],y:t[5],h:Math.abs(it.height)||Math.hypot(t[2],t[3])||10,w:it.width||0});
  });
  its.sort(function(a,b){return (b.y-a.y)||(a.x-b.x)});
  var lines=[];
  its.forEach(function(it){
    var l=lines[lines.length-1];
    if(l&&Math.abs(l.y-it.y)<=Math.max(2,Math.min(l.h,it.h)*0.45)){l.items.push(it);l.h=Math.max(l.h,it.h)}
    else lines.push({y:it.y,h:it.h,items:[it]});
  });
  lines.forEach(function(l){
    l.items.sort(function(a,b){return a.x-b.x});
    var t='',prev=null;
    l.items.forEach(function(it){
      if(prev){var gap=it.x-(prev.x+prev.w);if(gap>l.h*0.18&&!/\s$/.test(t)&&!/^\s/.test(it.s))t+=' '}
      t+=it.s;prev=it;
    });
    l.text=t.trim();l.x=l.items[0].x;
    l.right=Math.max.apply(null,l.items.map(function(i){return i.x+i.w}));
  });
  var chars=lines.reduce(function(n,l){return n+l.text.length},0);
  return {w:vp.width,h:vp.height,lines:lines,chars:chars};
}
var CJK=/[฀-๿぀-ヿ㐀-鿿가-힯]/;
function toParas(pt){

async function textToPdf(pages,set,chk){
  var P=need('PDFLib');
  try{await document.fonts.load('400 24px "IBM Plex Sans Thai"')}catch(e){}
  var W=1190,H=1684,M=112,fs=24,lh=Math.round(fs*1.65);
  var font=fs+'px "IBM Plex Sans Thai","Noto Sans Thai","Noto Sans CJK SC","Noto Sans JP","Noto Sans KR","Malgun Gothic","Yu Gothic","Microsoft YaHei",sans-serif';
  var seg=(typeof Intl!=='undefined'&&Intl.Segmenter)?new Intl.Segmenter(undefined,{granularity:'word'}):null;
  var doc=await P.PDFDocument.create(),c=null,x=null,y=0;
  async function flush(){
    if(!c)return;
    var b=await toBlob(c,'image/jpeg',0.9),img=await doc.embedJpg(await b.arrayBuffer());
    var pg=doc.addPage([595.28,841.89]);pg.drawImage(img,{x:0,y:0,width:595.28,height:841.89});
    freeCanvas(c);c=null;
  }
  function fresh(){c=mkCanvas(W,H);x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);x.fillStyle='#111';x.font=font;x.textBaseline='top';y=M}
  function wrap(text){
    var toks=seg?Array.from(seg.segment(text),function(s){return s.segment}):text.split(/(\s+)/),lines=[],line='',maxW=W-2*M;
    toks.forEach(function(t){
      if(x.measureText(line+t).width<=maxW){line+=t;return}
      if(line.trim())lines.push(line.replace(/\s+$/,''));
      line=t.replace(/^\s+/,'');
      while(x.measureText(line).width>maxW){
        var k=line.length;while(k>1&&x.measureText(line.slice(0,k)).width>maxW)k--;
        lines.push(line.slice(0,k));line=line.slice(k);
      }
    });
    if(line.trim())lines.push(line);
    return lines;
  }
  for(var p=0;p<pages.length;p++){
    chk();
    if(c&&p>0)await flush();
    if(!c)fresh();
    for(var k=0;k<pages[p].length;k++){
      var ls=wrap(pages[p][k]);
      for(var j=0;j<ls.length;j++){
        if(y+lh>H-M){await flush();fresh()}
        x.fillText(ls[j],M,y);y+=lh;
      }
      y+=Math.round(lh*0.55);
    }
    set(0.9+0.08*((p+1)/pages.length),'สร้างไฟล์ PDF หน้า '+(p+1));
  }
  await flush();
  return new Blob([await doc.save()],{type:'application/pdf'});
}

    var ev=o.type==='checkbox'||o.type==='select'?'change':'input';
    inp.addEventListener(ev,function(){sv[o.id]=o.type==='checkbox'?inp.checked:o.type==='range'?Number(inp.value):inp.value;applyWhen()});
    if(o.type!=='checkbox')w.appendChild(inp);
    if(o.hint){var h=document.createElement('div');h.className='hint';h.textContent=o.hint;w.appendChild(h)}
    els.opts.appendChild(w);
  });
  applyWhen();
}
function applyWhen(){
  var v=vals();
  (cur.options||[]).forEach(function(o){
    var w=els.opts.querySelector('[data-opt="'+o.id+'"]');
    if(w)w.hidden=o.when?!o.when(v):false;
  });
}
function renderFiles(){
  els.flist.innerHTML='';
  files.forEach(function(f,i){
    var li=document.createElement('li');li.className='fi';
    var n=document.createElement('span');n.className='n';n.textContent=f.name;n.title=f.name;
    var s=document.createElement('span');s.className='s';s.textContent=fmtB(f.size);
    li.appendChild(n);li.appendChild(s);
    if(cur.ordered){
      [['▲',-1,'เลื่อนขึ้น'],['▼',1,'เลื่อนลง']].forEach(function(a){
        var b=document.createElement('button');b.type='button';b.className='ib';b.textContent=a[0];b.setAttribute('aria-label',a[2]+' '+f.name);
        b.disabled=busy||(i+a[1]<0)||(i+a[1]>=files.length);
        b.addEventListener('click',function(){var t=files[i];files[i]=files[i+a[1]];files[i+a[1]]=t;renderFiles()});
        li.appendChild(b);
      });
    }
    var x=document.createElement('button');x.type='button';x.className='ib';x.textContent='✕';x.setAttribute('aria-label','เอา '+f.name+' ออก');x.disabled=busy;
    x.addEventListener('click',function(){files.splice(i,1);renderFiles()});
    li.appendChild(x);els.flist.appendChild(li);
  });
}
function addFiles(list){
  var arr=Array.prototype.slice.call(list||[]),ok=[],bad=0;
  arr.forEach(function(f){
    var isPdf=f.type==='application/pdf'||/\.pdf$/i.test(f.name),isImg=/^image\//.test(f.type)||/\.(jpe?g|png|webp|gif|bmp|avif)$/i.test(f.name);
    if((cur.kind==='pdf'&&isPdf)||(cur.kind==='image'&&isImg))ok.push(f);else bad++;
  });
  if(bad)toast('ข้ามไฟล์ที่ประเภทไม่ตรงกับเครื่องมือนี้ '+bad+' ไฟล์');
  if(!ok.length)return;
  files=cur.multi?files.concat(ok):[ok[0]];
  clearResults();renderFiles();
}
function clearResults(){
  urls.forEach(function(u){URL.revokeObjectURL(u)});urls=[];results=[];
  els.resCard.hidden=true;els.rl.innerHTML='';els.ftr.innerHTML='';els.resErr.innerHTML='';
}
function setProg(f,t){
  els.prog.hidden=false;els.barI.style.width=Math.round(Math.max(0,Math.min(1,f))*100)+'%';if(t)els.progT.textContent=t;
}
function resultItem(r){
  var d=document.createElement('div');d.className='ri';
  var th=document.createElement('div');th.className='th';
  if(/^image\//.test(r.blob.type)){var u=URL.createObjectURL(r.blob);urls.push(u);var im=document.createElement('img');im.src=u;im.alt='';th.appendChild(im)}
  else th.textContent='.'+(r.name.split('.').pop()||'').toLowerCase();
  var m=document.createElement('div');m.className='m';
  var b=document.createElement('b');b.textContent=r.name;var s=document.createElement('small');s.textContent=(r.note||'')+(r.note?' · ':'')+fmtB(r.blob.size);
  if(r.cls)s.className=r.cls;
  m.appendChild(b);m.appendChild(s);
  var btn=document.createElement('button');btn.type='button';btn.className='btn sm primary';btn.textContent='บันทึก';
  btn.addEventListener('click',function(){saveFile(r.name,r.blob)});
  d.appendChild(th);d.appendChild(m);d.appendChild(btn);return d;
}
function renderFooter(){
  els.ftr.innerHTML='';
  if(results.length>1){
    var b=document.createElement('button');b.type='button';b.className='btn';b.textContent='บันทึกทั้งหมดเป็น .zip ('+results.length+' ไฟล์)';
    b.addEventListener('click',async function(){
      b.disabled=true;
      try{
        var Z=need('JSZip'),z=new Z(),used={};
        results.forEach(function(r){var n=r.name;if(used[n]){var e=n.lastIndexOf('.');n=n.slice(0,e)+'-'+used[n]+n.slice(e);used[r.name]++}else used[n]=1;z.file(n,r.blob)});
        var zb=await z.generateAsync({type:'blob',compression:'STORE'});
        await saveFile('converted-files.zip',zb);
      }catch(e){toast('สร้างไฟล์ zip ไม่สำเร็จ')}
      b.disabled=false;
    });
    els.ftr.appendChild(b);
  }
}
function setBusy(b){
  busy=b;els.run.disabled=b;els.clear.disabled=b;els.stop.hidden=!b;
  Array.prototype.forEach.call(els.opts.querySelectorAll('input,select'),function(e){e.disabled=b});
  renderFiles();
}
async function run(){
  if(busy)return;
  if(!files.length){toast('เลือกไฟล์ก่อน');return}
  var v=vals(),bad=cur.validate&&cur.validate(v,files);
  if(bad){toast(bad);return}
  clearResults();els.resCard.hidden=false;els.resH.textContent='ผลลัพธ์';
  ctl=new AbortController();setBusy(true);setProg(0,'เริ่มทำงาน');
  var errs=[];
  var ctx={files:files.slice(),v:v,signal:ctl.signal,
    set:setProg,
    chk:function(){if(ctl.signal.aborted)throw Object.assign(new Error('ยกเลิกแล้ว'),{cancelled:true})},
    add:function(r){results.push(r);els.rl.appendChild(resultItem(r));renderFooter()},
    fail:function(name,e){if(e&&e.cancelled)throw e;errs.push((name?name+': ':'')+(e&&e.message||'เกิดข้อผิดพลาด'))}
  };
  try{await cur.run(ctx);setProg(1,'เสร็จแล้ว')}
  catch(e){if(e&&e.cancelled){toast('ยกเลิกแล้ว')}else errs.push(e&&e.message||'เกิดข้อผิดพลาดที่ไม่คาดคิด')}
  finally{setBusy(false);ctl=null}
  els.resErr.innerHTML='';
  errs.forEach(function(m){var d=document.createElement('div');d.className='err';d.style.marginBottom='8px';d.textContent=m;els.resErr.appendChild(d)});
  if(results.length)els.resH.textContent='ผลลัพธ์ '+results.length+' ไฟล์';
  else if(!errs.length)els.resCard.hidden=true;
  setTimeout(function(){els.prog.hidden=true},900);
  if(!els.resCard.hidden)els.resCard.scrollIntoView({behavior:'smooth',block:'nearest'});
}

/* ---------- wiring ---------- */
els.drop.addEventListener('click',function(){if(!busy)els.picker.click()});
els.drop.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();if(!busy)els.picker.click()}});
els.picker.addEventListener('change',function(){addFiles(els.picker.files);els.picker.value=''});
['dragenter','dragover'].forEach(function(n){els.drop.addEventListener(n,function(e){e.preventDefault();els.drop.classList.add('over')})});
['dragleave','drop'].forEach(function(n){els.drop.addEventListener(n,function(e){e.preventDefault();els.drop.classList.remove('over')})});
els.drop.addEventListener('drop',function(e){if(!busy)addFiles(e.dataTransfer&&e.dataTransfer.files)});
els.run.addEventListener('click',run);
els.stop.addEventListener('click',function(){if(ctl)ctl.abort()});
els.clear.addEventListener('click',function(){files=[];clearResults();renderFiles();els.prog.hidden=true});

renderNav();
var h=(location.hash||'').replace('#','');
select(BYID[h]?h:TOOLS[0].id);
})();
</script>

</body></html>
